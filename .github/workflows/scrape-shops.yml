name: scrape-shops

on:
  schedule:
    # 毎週月曜 21:00 UTC(日本時間 火曜 6:00)に実行。店舗・商品情報は大会日程等の
    # 静的な情報より変化しやすいため週次で更新する
    # (docs/coffee-app-data-model.md の update_cadence 設計を踏まえ、
    #  イベント(月次)より高頻度に設定)。
    - cron: "0 21 * * 1"
  workflow_dispatch:
    inputs:
      shop:
        description: "対象店舗(特定バグの検証等で1店舗だけ再実行したい場合に指定。既定はall=全店舗)"
        type: choice
        default: all
        options:
          - all
          - denimbis
          - millcoffee
          - philocoffea
          - fuglen
          - roastdesign
          - coffeemaru
          - mameconnect
          - rakuen
          - rhizomag
          - themoderncoffee
          - tsukikoya
          - coffee405
          - mameya
          - forest
          - nagi
          - meguro
          - tera
          - terminal
          - hoshikawa
          - leafletter
          - shibacoffee
          - mui
          - coulane
          - 27coffee
          - cafeclaudia
          - atsugicoffee
          - itukacoffee
          - cafecafa
          - woodberry
          - etop
          - finetime
          - kunikuni
          - nankundo
          - kagisippo
          - chouette
          - mamezen
          - anokoro
          - facon
          - himonya
          - sachine
          - aozora
          - beanstei

permissions:
  contents: write # data/*.json をコミット・pushするために必要

jobs:
  # 25店舗を並列に実行する。各店舗は独立したサイトへのスクレイピングなので、
  # 直列にする理由がない(courtesy delayは店舗ごとの各リクエスト間隔の話であり、
  # 店舗同士を並列化しても対象サイトへの負荷は増えない)。
  #
  # workflow_dispatchでshopを指定した場合は、該当する1店舗だけスクレイピングを
  # 実行する(他の店舗はScrape/Uploadステップがスキップされ、Uploadされない
  # =後続のaggregateはその店舗のdata_*.jsonを受け取らず、既存データをそのまま
  # 残す。aggregate_shops.py側で欠損店舗を許容する設計にしている)。matrixコンテキストは
  # ジョブレベルのifでは使えないため、対象を絞る条件はステップ単位で指定する。
  # 定期実行(schedule)では常に全店舗を実行する。
  scrape:
    strategy:
      fail-fast: false # 1店舗が失敗しても他の店舗の結果は活かす
      matrix:
        shop:
          - id: denimbis
            script: scrape_denimbis.py
            output: data_denimbis.json
          - id: millcoffee
            script: scrape_millcoffee.py
            output: data_millcoffee.json
          - id: philocoffea
            script: scrape_philocoffea.py
            output: data_philocoffea.json
          - id: fuglen
            script: scrape_fuglen.py
            output: data_fuglen.json
          - id: roastdesign
            script: scrape_roastdesign.py
            output: data_roastdesign.json
          - id: coffeemaru
            script: scrape_coffeemaru.py
            output: data_coffeemaru.json
          - id: mameconnect
            script: scrape_mameconnect.py
            output: data_mameconnect.json
          - id: rakuen
            script: scrape_rakuen.py
            output: data_rakuen.json
          - id: rhizomag
            script: scrape_rhizomag.py
            output: data_rhizomag.json
          - id: themoderncoffee
            script: scrape_themoderncoffee.py
            output: data_themoderncoffee.json
          - id: tsukikoya
            script: scrape_tsukikoya.py
            output: data_tsukikoya.json
          - id: coffee405
            script: scrape_405coffee.py
            output: data_405coffee.json
          - id: mameya
            script: scrape_mameya.py
            output: data_mameya.json
          - id: forest
            script: scrape_forest.py
            output: data_forest.json
          - id: nagi
            script: scrape_nagi.py
            output: data_nagi.json
          - id: meguro
            script: scrape_meguro.py
            output: data_meguro.json
          - id: tera
            script: scrape_tera.py
            output: data_tera.json
          - id: terminal
            script: scrape_terminal.py
            output: data_terminal.json
          - id: hoshikawa
            script: scrape_hoshikawa.py
            output: data_hoshikawa.json
          - id: leafletter
            script: scrape_leafletter.py
            output: data_leafletter.json
          - id: shibacoffee
            script: scrape_shibacoffee.py
            output: data_shibacoffee.json
          - id: mui
            script: scrape_mui.py
            output: data_mui.json
          - id: coulane
            script: scrape_coulane.py
            output: data_coulane.json
          - id: 27coffee
            script: scrape_27coffee.py
            output: data_27coffee.json
          - id: cafeclaudia
            script: scrape_cafeclaudia.py
            output: data_cafeclaudia.json
          - id: atsugicoffee
            script: scrape_atsugicoffee.py
            output: data_atsugicoffee.json
          - id: itukacoffee
            script: scrape_itukacoffee.py
            output: data_itukacoffee.json
          - id: cafecafa
            script: scrape_cafecafa.py
            output: data_cafecafa.json
          - id: woodberry
            script: scrape_woodberry.py
            output: data_woodberry.json
          - id: etop
            script: scrape_etop.py
            output: data_etop.json
          - id: finetime
            script: scrape_finetime.py
            output: data_finetime.json
          - id: kunikuni
            script: scrape_kunikuni.py
            output: data_kunikuni.json
          - id: nankundo
            script: scrape_nankundo.py
            output: data_nankundo.json
          - id: kagisippo
            script: scrape_kagisippo.py
            output: data_kagisippo.json
          - id: chouette
            script: scrape_chouette.py
            output: data_chouette.json
          - id: mamezen
            script: scrape_mamezen.py
            output: data_mamezen.json
          - id: anokoro
            script: scrape_anokoro.py
            output: data_anokoro.json
          - id: facon
            script: scrape_facon.py
            output: data_facon.json
          - id: himonya
            script: scrape_himonya.py
            output: data_himonya.json
          - id: sachine
            script: scrape_sachine.py
            output: data_sachine.json
          - id: aozora
            script: scrape_aozora.py
            output: data_aozora.json
          - id: beanstei
            script: scrape_beanstei.py
            output: data_beanstei.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 差分ベーススクレイピングがdata/products.jsonを参照するため必須

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape ${{ matrix.shop.id }}
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.shop == 'all' || github.event.inputs.shop == matrix.shop.id
        working-directory: scraper
        run: python ${{ matrix.shop.script }}

      - name: Upload ${{ matrix.shop.id }} output
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.shop == 'all' || github.event.inputs.shop == matrix.shop.id
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ matrix.shop.id }}
          path: scraper/${{ matrix.shop.output }}
          retention-days: 1

  # 25店舗すべてのスクレイピングが完了してから、まとめて集約・コミットする
  # (店舗ごとに個別コミットすると、data/shops.json・data/products.jsonの
  # 内容が実行順に依存して揺れるため)。
  aggregate:
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all shop outputs
        uses: actions/download-artifact@v4
        with:
          pattern: scrape-*
          path: scraper
          merge-multiple: true

      - name: Aggregate into data/shops.json and data/products.json
        working-directory: scraper
        run: python aggregate_shops.py

      - name: Commit updated data (no-op if unchanged)
        run: |
          git config user.name "coffee-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/shops.json data/products.json
          git diff --staged --quiet || git commit -m "chore: update shops/products data $(date -u +%Y-%m-%d)"
          git push
