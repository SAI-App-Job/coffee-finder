permissions:
  contents: write # data/*.json をコミット・pushするために必要

jobs:
  # 25店舗を並列に実行する。各店舗は独立したサイトへのスクレイピングなので、
  # 直列にする理由がない(courtesy delayは店舗ごとの各リクエスト間隔の話であり、
  # 店舗同士を並列化しても対象サイトへの負荷は増えない)。
  #
  # workflow_dispatchでshopを指定した場合は、該当する1店舗だけスクレイピングを
  # 実行する(他の店舗はScrape/Uploadステップがスキップされ、Uploadされない
  # =後続のaggregateはその店舗のdata_*.jsonを受け取らず、既存データをそのまま
  # 残す。aggregate_shops.py側で欠損店舗を許容する設計にしている)。matrixコンテキストは
  # ジョブレベルのifでは使えないため、対象を絞る条件はステップ単位で指定する。
  # 定期実行(schedule)では常に全店舗を実行する。
  scrape:
    strategy:
      fail-fast: false # 1店舗が失敗しても他の店舗の結果は活かす
      matrix:
        shop:
          - id: denimbis
            script: scrape_denimbis.py
            output: data_denimbis.json
          - id: millcoffee
            script: scrape_millcoffee.py
            output: data_millcoffee.json
