name: scrape-shops

on:
  schedule:
    # 毎週月曜 21:00 UTC(日本時間 火曜 6:00)に実行。店舗・商品情報は大会日程等の
    # 静的な情報より変化しやすいため週次で更新する
    # (docs/coffee-app-data-model.md の update_cadence 設計を踏まえ、
    #  イベント(月次)より高頻度に設定)。
    - cron: "0 21 * * 1"
  workflow_dispatch: {} # 手動実行用

permissions:
  contents: write # data/*.json をコミット・pushするために必要

jobs:
  # 3店舗を並列に実行する。各店舗は独立したサイトへのスクレイピングなので、
  # 直列にする理由がない(courtesy delayは店舗ごとの各リクエスト間隔の話であり、
  # 店舗同士を並列化しても対象サイトへの負荷は増えない)。
  scrape:
    strategy:
      fail-fast: false # 1店舗が失敗しても他の店舗の結果は活かす
      matrix:
        shop:
          - id: denimbis
            script: scrape_denimbis.py
            output: data_denimbis.json
          - id: millcoffee
            script: scrape_millcoffee.py
            output: data_millcoffee.json
          - id: philocoffea
            script: scrape_philocoffea.py
            output: data_philocoffea.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 差分ベーススクレイピングがdata/products.jsonを参照するため必須

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape ${{ matrix.shop.id }}
        working-directory: scraper
        run: python ${{ matrix.shop.script }}

      - name: Upload ${{ matrix.shop.id }} output
        uses: actions/upload-artifact@v4
        with:
          name: scrape-${{ matrix.shop.id }}
          path: scraper/${{ matrix.shop.output }}
          retention-days: 1

  # 3店舗すべてのスクレイピングが完了してから、まとめて集約・コミットする
  # (店舗ごとに個別コミットすると、data/shops.json・data/products.jsonの
  # 内容が実行順に依存して揺れるため)。
  aggregate:
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all shop outputs
        uses: actions/download-artifact@v4
        with:
          pattern: scrape-*
          path: scraper
          merge-multiple: true

      - name: Aggregate into data/shops.json and data/products.json
        working-directory: scraper
        run: python aggregate_shops.py

      - name: Commit updated data (no-op if unchanged)
        run: |
          git config user.name "coffee-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/shops.json data/products.json
          git diff --staged --quiet || git commit -m "chore: update shops/products data $(date -u +%Y-%m-%d)"
          git push
